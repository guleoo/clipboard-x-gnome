name: Verify

on:
  workflow_call:
    inputs:
      release-tag:
        description: Version tag to validate for a release; empty for ordinary CI
        type: string
        default: ''
    outputs:
      archive-name:
        description: Validated extension ZIP filename
        value: ${{ jobs.distcheck.outputs.archive-name }}
      artifact-name:
        description: Uploaded GNOME 50 package artifact
        value: ${{ jobs.distcheck.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  distcheck:
    name: GNOME${{ matrix.shell }} - Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: '50'
            container: fedora:44
          - shell: '51'
            container: fedora:45
    container: ${{ matrix.container }}
    # Both matrix legs produce identical names; only GNOME 50 uploads the ZIP.
    outputs:
      archive-name: ${{ steps.package.outputs.archive-name }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME ${{ matrix.shell }} build dependencies
        run: >-
          dnf install -y
          7zip dbus-daemon gettext git gjs glib2 gnome-shell
          gtk4 gvfs gvfs-client libadwaita libsoup3 meson ninja-build nodejs openssl python3
          mesa-dri-drivers mesa-libEGL dejavu-sans-fonts
      - name: Verify GNOME version and record environment
        env:
          EXPECTED_SHELL: ${{ matrix.shell }}
        run: |
          actual=$(gnome-shell --version | sed -nE 's/^GNOME Shell ([0-9]+).*/\1/p')
          printf 'Expected GNOME Shell %s; installed %s\n' "$EXPECTED_SHELL" "$actual"
          test "$actual" = "$EXPECTED_SHELL"
          gnome-shell --version
          gjs --version
          rpm -q glib2 libsoup3 mutter mesa-dri-drivers
          uname -r
      - name: Configure and build
        run: |
          meson setup build -Dtarget=package
          meson compile -C build
      - name: Check JavaScript syntax
        run: find src tests -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Run regression test suite
        run: dbus-run-session -- meson test -C build --no-suite stress --print-errorlogs
      # Exit 2 (missing dependency) fails too: a skipped check must not pass.
      - name: Run headless acceptance
        shell: bash
        run: bash tools/test-logic-acceptance.sh 2>&1 | tee build/meson-logs/logic-acceptance.log
      - name: Create and validate extension ZIP
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          meson install -C build
          version=$(meson introspect --projectinfo build |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          archive_name="clipboard-x-gnome_${version}.zip"
          printf 'archive-name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
          printf 'artifact-name=%s\n' "${archive_name%.zip}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 tools/check_release.py "build/$archive_name" --tag "$RELEASE_TAG"
          else
            python3 tools/check_release.py "build/$archive_name"
          fi
      - name: Test isolated Shell lifecycle
        shell: bash
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile
          # Package installation creates this marker although no logind runs in a container.
          # Let Shell use its built-in no-logind test environment; never alter a host session.
          if [[ -d /run/systemd/seats ]]; then
            rmdir /run/systemd/seats
          fi
          bash tools/test-shell-compatibility.sh "build/${{ steps.package.outputs.archive-name }}" "${{ matrix.shell }}" \
            2>&1 | tee build/meson-logs/shell-compatibility.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-gnome-${{ matrix.shell }}
          path: build/meson-logs/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.shell == '50'
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: build/${{ steps.package.outputs.archive-name }}
          if-no-files-found: error
          retention-days: 14
