[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-x-sync-service"
version = "0.1.0"
description = "Local synchronization service for Clipboard X"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
clipboard-x-service = "clipboard_x_service.entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
clipboard_x_service = ["io.github.guleo.ClipboardX.Sync1.xml"]

[tool.setuptools.packages.find]
where = ["src"]
